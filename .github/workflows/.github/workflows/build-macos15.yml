name: Build macOS 15 Version

on:
  workflow_dispatch: # 允许在 GitHub 页面手动触发

jobs:
  build:
    name: Build for macOS 15
    runs-on: macos-15 # 使用 GitHub 提供的 macOS 15 Sequoia 运行器
    
    steps:
      - name: Checkout Repository
        # 使用最新的 v4 版本，配合下方的 Node 设置可消除警告
        uses: actions/checkout@v4 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 指定 Node.js 22，避免 Node 20 弃用警告，同时兼容项目中的 JS 脚本
          node-version: '22' 
          cache: 'npm' # 如果项目有 package.json，可加速依赖安装

      - name: Select Xcode
        run: |
          # macOS 15 运行器默认配备 Xcode 16.x
          echo "DEVELOPER_DIR=/Applications/Xcode_16.app/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Build Tinycast (Universal)
        run: |
          # ARCHS="arm64 x86_64" 确保编译出同时支持 M系列芯片和 Intel 芯片的通用二进制文件
          # CODE_SIGN_IDENTITY="-" 表示在 CI 环境中使用临时自签名
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            MARKETING_VERSION="1.0.0" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build

      - name: Package as ZIP
        run: |
          cd "$RUNNER_TEMP/DerivedData/Build/Products/Release/"
          # 将 .app 打包为 .zip，方便下载且保留权限结构
          zip -r Tinycast-macOS15-Universal.zip Tinycast.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tinycast-macOS15-Universal
          path: ${{ runner.temp }}/DerivedData/Build/Products/Release/Tinycast-macOS15-Universal.zip
          retention-days: 7 # 保留 7 天
